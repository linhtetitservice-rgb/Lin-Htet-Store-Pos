name: Generate Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web Asset Directory
        run: |
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          rm -rf www/www www/.git www/.github

      - name: Install Capacitor & Generate Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Lin Htet Store POS" "com.linhtet.storepos" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Fix Duplicate Kotlin Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload StorePOS APK
        uses: actions/upload-artifact@v4
        with:
          name: LinHtet-StorePOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
