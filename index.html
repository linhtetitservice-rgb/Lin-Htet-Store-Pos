<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lin Htet Store POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans pb-16">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-md">
    <div>
      <h1 id="shop-title" class="font-bold text-lg text-emerald-400">Lin Htet Store POS</h1>
      <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-medium">READY</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openModal('modal-settings')" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">⚙️</button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="flex bg-slate-800/80 border-b border-slate-700 text-xs font-semibold overflow-x-auto">
    <button onclick="switchTab('pos')" id="tab-btn-pos" class="flex-1 py-3 text-center border-b-2 border-emerald-400 text-emerald-400 font-bold">POS</button>
    <button onclick="switchTab('inventory')" id="tab-btn-inventory" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400">Inventory</button>
    <button onclick="switchTab('sales')" id="tab-btn-sales" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400">Sales</button>
    <button onclick="switchTab('analytics')" id="tab-btn-analytics" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400">Analytics</button>
  </nav>

  <!-- POS TAB -->
  <main id="tab-pos" class="tab-content active p-4 flex-1">
    <div class="mb-4">
      <input type="text" id="pos-search" oninput="renderPOSProducts()" placeholder="🔍 Search product..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
    </div>

    <!-- Product Grid -->
    <div id="pos-product-list" class="grid grid-cols-2 gap-3 mb-6"></div>

    <!-- Current Bill / Cart Summary -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
      <h3 class="font-bold text-sm text-slate-300 mb-2">Current Cart (<span id="cart-count">0</span> items)</h3>
      <div id="cart-items" class="divide-y divide-slate-700 max-h-40 overflow-y-auto mb-3 text-xs"></div>
      
      <div class="flex justify-between items-center text-sm font-semibold border-t border-slate-700 pt-2 mb-3">
        <span>Total:</span>
        <span id="cart-total" class="text-lg text-emerald-400 font-black">0 MMK</span>
      </div>

      <div class="grid grid-cols-2 gap-2 mb-3">
        <select id="pos-payment" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs">
          <option value="Cash">Cash</option>
          <option value="KPay">KPay</option>
          <option value="WavePay">WavePay</option>
        </select>
        <button onclick="checkout()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-900 font-bold rounded-lg py-2 text-xs transition">
          Checkout & Voucher
        </button>
      </div>
    </div>
  </main>

  <!-- INVENTORY TAB -->
  <main id="tab-inventory" class="tab-content p-4 flex-1">
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-bold text-base text-slate-200">Stock Inventory</h2>
      <button onclick="openAddProductModal()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs">+ Add Item</button>
    </div>
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-900/50 text-slate-400 border-b border-slate-700">
          <tr>
            <th class="p-3">Item</th>
            <th class="p-3">Price</th>
            <th class="p-3">Qty</th>
            <th class="p-3 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="inventory-list" class="divide-y divide-slate-700"></tbody>
      </table>
    </div>
  </main>

  <!-- SALES TAB -->
  <main id="tab-sales" class="tab-content p-4 flex-1">
    <h2 class="font-bold text-base text-slate-200 mb-3">Sales Records</h2>
    <div id="sales-list" class="space-y-2 text-xs"></div>
  </main>

  <!-- ANALYTICS TAB -->
  <main id="tab-analytics" class="tab-content p-4 flex-1">
    <h2 class="font-bold text-base text-slate-200 mb-3">Analytics & Profit</h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-slate-800 border border-slate-700 p-3 rounded-xl">
        <p class="text-xs text-slate-400">Total Revenue</p>
        <h3 id="stat-revenue" class="text-base font-bold text-emerald-400">0 MMK</h3>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-3 rounded-xl">
        <p class="text-xs text-slate-400">Net Profit</p>
        <h3 id="stat-profit" class="text-base font-bold text-blue-400">0 MMK</h3>
      </div>
    </div>
  </main>

  <!-- Voucher Receipt Modal -->
  <div id="modal-voucher" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-4 flex flex-col">
      <div id="voucher-preview" class="bg-white text-black p-4 rounded-xl text-xs font-mono mb-4">
        <div class="text-center pb-2 border-b border-dashed border-gray-300">
          <h3 id="v-shop" class="font-bold text-base">Shop Name</h3>
          <p id="v-date" class="text-[10px] text-gray-500"></p>
        </div>
        <div id="v-items" class="py-2 border-b border-dashed border-gray-300 space-y-1"></div>
        <div class="pt-2 flex justify-between font-bold text-sm">
          <span>TOTAL:</span>
          <span id="v-total">0</span>
        </div>
        <p class="text-center text-[10px] text-gray-400 mt-2">Thank you! Come again.</p>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="downloadVoucherPNG()" class="bg-emerald-500 text-slate-900 font-bold py-2 rounded-lg text-xs">Download PNG</button>
        <button onclick="closeModal('modal-voucher')" class="bg-slate-700 text-white py-2 rounded-lg text-xs">Close</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let products = JSON.parse(localStorage.getItem('pos_products')) || [
      { id: 1, name: 'Cola Can', cost: 1000, price: 1500, stock: 20 },
      { id: 2, name: 'Coffee Mix', cost: 300, price: 500, stock: 50 }
    ];
    let cart = [];
    let sales = JSON.parse(localStorage.getItem('pos_sales')) || [];
    let settings = JSON.parse(localStorage.getItem('pos_settings')) || { shopName: 'Lin Htet Store' };

    function saveState() {
      localStorage.setItem('pos_products', JSON.stringify(products));
      localStorage.setItem('pos_sales', JSON.stringify(sales));
      localStorage.setItem('pos_settings', JSON.stringify(settings));
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      ['pos', 'inventory', 'sales', 'analytics'].forEach(t => {
        const btn = document.getElementById('tab-btn-' + t);
        if (t === tabName) {
          btn.className = 'flex-1 py-3 text-center border-b-2 border-emerald-400 text-emerald-400 font-bold';
        } else {
          btn.className = 'flex-1 py-3 text-center border-b-2 border-transparent text-slate-400';
        }
      });
      if (tabName === 'inventory') renderInventory();
      if (tabName === 'sales') renderSales();
      if (tabName === 'analytics') renderAnalytics();
    }

    function renderPOSProducts() {
      const q = document.getElementById('pos-search').value.toLowerCase();
      const list = document.getElementById('pos-product-list');
      list.innerHTML = '';
      products.filter(p => p.name.toLowerCase().includes(q)).forEach(p => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700 p-3 rounded-xl cursor-pointer active:bg-slate-700';
        card.onclick = () => addToCart(p.id);
        card.innerHTML = `
          <h4 class="font-bold text-xs text-slate-200">${p.name}</h4>
          <div class="flex justify-between items-center mt-2">
            <span class="text-emerald-400 font-bold text-xs">${p.price} MMK</span>
            <span class="text-[10px] text-slate-400">Stock: ${p.stock}</span>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      if (!p || p.stock <= 0) return alert('Out of stock!');
      const exist = cart.find(x => x.id === id);
      if (exist) {
        if (exist.qty >= p.stock) return alert('Exceeds available stock!');
        exist.qty++;
      } else {
        cart.push({ ...p, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const el = document.getElementById('cart-items');
      el.innerHTML = '';
      let total = 0;
      let count = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        count += item.qty;
        const row = document.createElement('div');
        row.className = 'py-1 flex justify-between items-center';
        row.innerHTML = `
          <span>${item.name} x${item.qty}</span>
          <span class="font-semibold">${item.price * item.qty} MMK</span>
        `;
        el.appendChild(row);
      });
      document.getElementById('cart-count').innerText = count;
      document.getElementById('cart-total').innerText = total + ' MMK';
    }

    function checkout() {
      if (cart.length === 0) return alert('Cart is empty!');
      const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
      const cost = cart.reduce((a, b) => a + (b.cost * b.qty), 0);
      const sale = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        items: [...cart],
        total: total,
        profit: total - cost,
        payment: document.getElementById('pos-payment').value
      };

      // Deduct stock
      cart.forEach(c => {
        const prod = products.find(p => p.id === c.id);
        if (prod) prod.stock -= c.qty;
      });

      sales.unshift(sale);
      saveState();

      // Show Voucher
      document.getElementById('v-shop').innerText = settings.shopName || 'Store POS';
      document.getElementById('v-date').innerText = sale.date;
      document.getElementById('v-total').innerText = total + ' MMK';
      const vi = document.getElementById('v-items');
      vi.innerHTML = '';
      cart.forEach(i => {
        vi.innerHTML += `<div class="flex justify-between"><span>${i.name} x${i.qty}</span><span>${i.price * i.qty}</span></div>`;
      });

      cart = [];
      renderCart();
      renderPOSProducts();
      openModal('modal-voucher');
    }

    function renderInventory() {
      const tb = document.getElementById('inventory-list');
      tb.innerHTML = '';
      products.forEach(p => {
        tb.innerHTML += `
          <tr class="hover:bg-slate-800/50">
            <td class="p-3 font-semibold">${p.name}</td>
            <td class="p-3">${p.price}</td>
            <td class="p-3">${p.stock}</td>
            <td class="p-3 text-right">
              <button onclick="deleteProduct(${p.id})" class="text-rose-400 font-bold">Del</button>
            </td>
          </tr>
        `;
      });
    }

    function renderSales() {
      const sl = document.getElementById('sales-list');
      sl.innerHTML = '';
      sales.forEach(s => {
        sl.innerHTML += `
          <div class="bg-slate-800 border border-slate-700 p-3 rounded-xl flex justify-between items-center">
            <div>
              <p class="font-bold text-slate-200">${s.payment} - ${s.total} MMK</p>
              <p class="text-[10px] text-slate-400">${s.date}</p>
            </div>
            <span class="text-xs text-emerald-400 font-semibold">+${s.profit} Profit</span>
          </div>
        `;
      });
    }

    function renderAnalytics() {
      const rev = sales.reduce((a, b) => a + b.total, 0);
      const prof = sales.reduce((a, b) => a + b.profit, 0);
      document.getElementById('stat-revenue').innerText = rev + ' MMK';
      document.getElementById('stat-profit').innerText = prof + ' MMK';
    }

    function downloadVoucherPNG() {
      const node = document.getElementById('voucher-preview');
      html2canvas(node).then(canvas => {
        const link = document.createElement('a');
        link.download = 'voucher-' + Date.now() + '.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
      document.getElementById(id).classList.add('flex');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.getElementById(id).classList.remove('flex');
    }

    // Init
    window.onload = () => {
      renderPOSProducts();
    };
  </script>
</body>
</html>
