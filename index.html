<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIN HTET POS V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f4f6fa;color:#172033}.login{min-height:100vh;display:grid;place-items:center}.loginbox,.panel{background:#fff;border-radius:14px;padding:22px;box-shadow:0 3px 18px #0001}.loginbox{width:min(390px,92%)}input,select{padding:11px;border:1px solid #dbe2ea;border-radius:8px;width:100%;margin:6px 0}.btn{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;cursor:pointer}.btn.gray{background:#64748b}.btn.red{background:#dc2626}.app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#111827;color:#fff;padding:20px 13px}.brand{font-size:21px;font-weight:800;padding:10px 10px 25px}.nav button{display:block;width:100%;padding:12px;border:0;background:none;color:#cbd5e1;text-align:left;border-radius:8px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#2563eb;color:#fff}.main{margin-left:235px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;padding:18px;border-radius:12px}.value{font-size:25px;font-weight:800;margin-top:6px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{border:1px solid #e4e8ee;padding:13px;border-radius:10px;cursor:pointer;background:#fff}.product:hover{border-color:#2563eb}.price{color:#2563eb;font-weight:bold;margin:7px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4}.modal{display:none;position:fixed;inset:0;background:#0008;place-items:center}.modal.open{display:grid}.modalbox{background:white;width:min(520px,92%);padding:20px;border-radius:12px}.row{display:flex;gap:8px}.row>*{flex:1}.empty{text-align:center;color:#94a3b8;padding:28px}@media(max-width:900px){.side{width:68px}.brand{font-size:0}.brand:after{content:"POS";font-size:18px}.main{margin-left:68px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2>LIN HTET POS</h2><p class="muted">Demo login: admin / 1234</p><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="login()">Login</button></div></div>
<div id="app" class="app"><aside class="side"><div class="brand">LIN HTET POS</div><div class="nav">
<button onclick="go('dashboard',this)">📊 Dashboard</button><button onclick="go('pos',this)">🛒 POS</button><button onclick="go('products',this)">📦 Products</button><button onclick="go('purchases',this)">🚚 Purchases</button><button onclick="go('sales',this)">🧾 Sales</button><button onclick="go('customers',this)">👥 Customers</button><button onclick="go('suppliers',this)">🏭 Suppliers</button><button onclick="go('expenses',this)">💸 Expenses</button><button onclick="go('reports',this)">📈 Reports</button><button onclick="go('backup',this)">💾 Backup</button><button onclick="logout()">🚪 Logout</button></div></aside><main class="main" id="view"></main></div>
<div id="modal" class="modal"><div class="modalbox" id="mb"></div></div>
<script>
const K='LHPOSV2';let db=JSON.parse(localStorage.getItem(K)||'null')||{products:[{id:1,name:'Coca Cola',sku:'1001',price:1200,cost:800,stock:40,cat:'Drinks'},{id:2,name:'Pepsi',sku:'1002',price:1200,cost:800,stock:35,cat:'Drinks'},{id:3,name:'Potato Chips',sku:'1003',price:1800,cost:1100,stock:25,cat:'Snacks'}],sales:[],customers:[],suppliers:[],purchases:[],expenses:[],settings:{shop:'LIN HTET POS',currency:'MMK'}};
let cart=[];function save(){localStorage.setItem(K,JSON.stringify(db))}function m(n){return Number(n||0).toLocaleString()};function login(){if((user.value==='admin'&&pass.value==='1234')||(user.value==='cashier'&&pass.value==='1234')){loginEl(false);go('dashboard')}else alert('Invalid login')}function loginEl(on){document.getElementById('login').style.display=on?'grid':'none';document.getElementById('app').style.display=on?'none':'flex'}function logout(){loginEl(true)}loginEl(true);
function go(p,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');let v=document.getElementById('view');v.innerHTML={dashboard:dash,pos:pos,products:products,purchases:purchases,sales:sales,customers:customers,suppliers:suppliers,expenses:expenses,reports:reports,backup:backup}[p]()}
function dash(){let sales=db.sales.reduce((a,s)=>a+s.total,0),profit=db.sales.reduce((a,s)=>a+s.profit,0);return `<div class=top><h1>Dashboard</h1><button class=btn onclick="go('pos')">+ New Sale</button></div><div class=cards><div class=card><span class=muted>Total Sales</span><div class=value>${m(sales)}</div></div><div class=card><span class=muted>Profit</span><div class=value>${m(profit)}</div></div><div class=card><span class=muted>Orders</span><div class=value>${db.sales.length}</div></div><div class=card><span class=muted>Low Stock</span><div class=value>${db.products.filter(p=>p.stock<=5).length}</div></div></div><div class=panel style="margin-top:16px"><h3>Recent Sales</h3>${tableSales(db.sales.slice(-10).reverse())}</div>`}
function pos(){return `<div class=top><h1>POS / Cashier</h1><button class="btn gray" onclick="cart=[];go('pos')">Clear</button></div><div class=grid><div class=panel><input id=q placeholder="Search name / barcode" oninput="filterP()"><div class=products id=pg>${cards(db.products)}</div></div><div class=panel><h3>Cart</h3><div id=ct>${cartHTML()}</div></div></div>`}
function cards(a){return a.map(p=>`<div class=product onclick="add(${p.id})"><b>${p.name}</b><div class=muted>${p.cat} · SKU ${p.sku}</div><div class=price>${m(p.price)} ${db.settings.currency}</div><small>Stock ${p.stock}</small></div>`).join('')||'<div class=empty>No products</div>'}
function filterP(){let x=q.value.toLowerCase();pg.innerHTML=cards(db.products.filter(p=>(p.name+p.sku).toLowerCase().includes(x)))}
function add(id){let p=db.products.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(!p.stock)return alert('Out of stock');if(x){if(x.qty>=p.stock)return alert('Stock limit');x.qty++}else cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});ct.innerHTML=cartHTML()}
function cartHTML(){if(!cart.length)return '<div class=empty>Cart is empty</div>';let total=cart.reduce((a,x)=>a+x.price*x.qty,0);return cart.map(x=>`<div class=row style="margin:9px 0"><div>${x.name}<br><small>${m(x.price)} × ${x.qty}</small></div><button class="btn gray" onclick="qty(${x.id},-1)">−</button><button class="btn gray" onclick="qty(${x.id},1)">+</button></div>`).join('')+`<hr><h2 style=text-align:right>Total ${m(total)}</h2><button class=btn style="width:100%" onclick="pay()">Pay & Print Receipt</button>`}
function qty(id,d){let x=cart.find(x=>x.id===id);x.qty+=d;if(x.qty<1)cart=cart.filter(x=>x.id!==id);ct.innerHTML=cartHTML()}
function pay(){if(!cart.length)return;let total=cart.reduce((a,x)=>a+x.price*x.qty,0),method=prompt('Payment: Cash / Card / Mobile','Cash')||'Cash';cart.forEach(x=>db.products.find(p=>p.id===x.id).stock-=x.qty);let sale={id:Date.now(),date:new Date().toISOString(),items:cart.map(x=>({...x})),total,profit:cart.reduce((a,x)=>a+(x.price-x.cost)*x.qty,0),method};db.sales.push(sale);save();receipt(sale);cart=[];go('pos')}
function receipt(s){let w=window.open('','_blank','width=360,height=600');if(!w)return;w.document.write(`<html><body style="font:14px monospace;width:280px"><h3 style="text-align:center">${db.settings.shop}</h3><div>Invoice #${s.id}<br>${new Date(s.date).toLocaleString()}<br>Payment: ${s.method}</div><hr>${s.items.map(x=>`${x.name}<br>${x.qty} x ${m(x.price)} = ${m(x.qty*x.price)}<br>`).join('')}<hr><b>TOTAL: ${m(s.total)} ${db.settings.currency}</b><script>print();<\/script></body></html>`);w.document.close()}
function products(){return `<div class=top><h1>Products</h1><button class=btn onclick="productForm()">+ Product</button></div><div class=panel><table><tr><th>Name</th><th>SKU</th><th>Cost</th><th>Price</th><th>Stock</th><th></th></tr>${db.products.map(p=>`<tr><td>${p.name}</td><td>${p.sku}</td><td>${m(p.cost)}</td><td>${m(p.price)}</td><td>${p.stock}</td><td><button class="btn red" onclick="del(${p.id})">Delete</button></td></tr>`).join('')}</table></div>`}
function productForm(){modal.classList.add('open');mb.innerHTML=`<h3>Add Product</h3><input id=n placeholder=Name><input id=s placeholder=SKU><div class=row><input id=c type=number placeholder="Cost"><input id=p type=number placeholder="Selling price"><input id=st type=number placeholder=Stock></div><input id=cat placeholder=Category><button class=btn onclick="addP()">Save</button>`}
function addP(){db.products.push({id:Date.now(),name:n.value,sku:s.value,cost:+c.value||0,price:+p.value||0,stock:+st.value||0,cat:cat.value||'General'});save();close();go('products')}
function del(id){if(confirm('Delete?')){db.products=db.products.filter(p=>p.id!==id);save();go('products')}}
function purchases(){return `<div class=top><h1>Purchases</h1><button class=btn onclick="purchaseForm()">+ Stock In</button></div><div class=panel><table><tr><th>Date</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Cost</th></tr>${db.purchases.map(x=>`<tr><td>${x.date}</td><td>${x.supplier}</td><td>${x.product}</td><td>${x.qty}</td><td>${m(x.cost)}</td></tr>`).join('')||'<tr><td colspan=5>No purchases</td></tr>'}</table></div>`}
function purchaseForm(){modal.classList.add('open');mb.innerHTML=`<h3>Stock In / Purchase</h3><select id=pi>${db.products.map(p=>`<option value=${p.id}>${p.name}</option>`).join('')}</select><input id=psu placeholder=Supplier><input id=pq type=number placeholder=Quantity><input id=pcost type=number placeholder="Total cost"><button class=btn onclick="buy()">Save</button>`}
function buy(){let p=db.products.find(x=>x.id==pi.value),q=+pq.value||0;p.stock+=q;db.purchases.push({date:new Date().toLocaleString(),supplier:psu.value,product:p.name,qty:q,cost:+pcost.value||0});save();close();go('purchases')}
function sales(){return `<div class=top><h1>Sales & Returns</h1></div><div class=panel>${tableSales([...db.sales].reverse())}</div>`}
function tableSales(a){return a.length?`<table><tr><th>Invoice</th><th>Date</th><th>Payment</th><th>Total</th><th>Return</th></tr>${a.map(s=>`<tr><td>#${s.id}</td><td>${new Date(s.date).toLocaleString()}</td><td>${s.method}</td><td>${m(s.total)}</td><td><button class="btn red" onclick="refund(${s.id})">Refund</button></td></tr>`).join('')}</table>`:'<div class=empty>No sales</div>'}
function refund(id){let s=db.sales.find(x=>x.id===id);if(!s)return;if(confirm('Refund full invoice?')){s.items.forEach(x=>db.products.find(p=>p.id===x.id).stock+=x.qty);db.sales=db.sales.filter(x=>x.id!==id);save();go('sales')}}
function customers(){return `<div class=top><h1>Customers</h1><button class=btn onclick="simpleForm('Customer','customers')">+ Customer</button></div><div class=panel><table><tr><th>Name</th><th>Phone</th></tr>${db.customers.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td></tr>`).join('')||'<tr><td colspan=2>No customers</td></tr>'}</table></div>`}
function suppliers(){return `<div class=top><h1>Suppliers</h1><button class=btn onclick="simpleForm('Supplier','suppliers')">+ Supplier</button></div><div class=panel><table><tr><th>Name</th><th>Phone</th></tr>${db.suppliers.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td></tr>`).join('')||'<tr><td colspan=2>No suppliers</td></tr>'}</table></div>`}
function simpleForm(type,key){modal.classList.add('open');mb.innerHTML=`<h3>Add ${type}</h3><input id=sn placeholder=Name><input id=sp placeholder=Phone><button class=btn onclick="db.${key}.push({name:sn.value,phone:sp.value});save();close();go('${key}')">Save</button>`}
function expenses(){return `<div class=top><h1>Expenses</h1><button class=btn onclick="expenseForm()">+ Expense</button></div><div class=panel><table><tr><th>Date</th><th>Title</th><th>Amount</th></tr>${db.expenses.map(x=>`<tr><td>${x.date}</td><td>${x.title}</td><td>${m(x.amount)}</td></tr>`).join('')||'<tr><td colspan=3>No expenses</td></tr>'}</table></div>`}
function expenseForm(){modal.classList.add('open');mb.innerHTML=`<h3>Add Expense</h3><input id=et placeholder=Title><input id=ea type=number placeholder=Amount><button class=btn onclick="db.expenses.push({date:new Date().toLocaleString(),title:et.value,amount:+ea.value||0});save();close();go('expenses')">Save</button>`}
function reports(){let s=db.sales.reduce((a,x)=>a+x.total,0),p=db.sales.reduce((a,x)=>a+x.profit,0),e=db.expenses.reduce((a,x)=>a+x.amount,0);return `<div class=top><h1>Reports</h1></div><div class=cards><div class=card>Sales<div class=value>${m(s)}</div></div><div class=card>Gross Profit<div class=value>${m(p)}</div></div><div class=card>Expenses<div class=value>${m(e)}</div></div><div class=card>Net Profit<div class=value>${m(p-e)}</div></div></div><div class=panel style="margin-top:16px"><h3>Payment Summary</h3><table><tr><th>Method</th><th>Orders</th><th>Amount</th></tr>${['Cash','Card','Mobile'].map(x=>{let a=db.sales.filter(s=>s.method.toLowerCase()===x.toLowerCase());return `<tr><td>${x}</td><td>${a.length}</td><td>${m(a.reduce((z,s)=>z+s.total,0))}</td></tr>`}).join('')}</table></div>`}
function backup(){return `<div class=top><h1>Backup & Settings</h1></div><div class=panel><h3>Database Backup</h3><button class=btn onclick="downloadBackup()">Download Backup</button> <button class="btn gray" onclick="document.getElementById('restore').click()">Restore</button><input id=restore type=file accept=.json style="display:none" onchange="restoreDB(this)"><hr><h3>Shop Settings</h3><input id=shop value="${db.settings.shop}"><input id=currency value="${db.settings.currency}"><button class=btn onclick="db.settings.shop=shop.value;db.settings.currency=currency.value;save();alert('Saved')">Save Settings</button></div>`}
function downloadBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='lin-htet-pos-backup.json';a.click()}
function restoreDB(x){let f=x.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Restored');go('dashboard')}catch(e){alert('Invalid backup')}};r.readAsText(f)}
function close(){modal.classList.remove('open')}save();
</script></body></html>
